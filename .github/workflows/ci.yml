name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcheck
      - run: pnpm test
      - run: pnpm build

  integracion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kuorum
          POSTGRES_PASSWORD: kuorum
          POSTGRES_DB: kuorum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuorum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kuorum:kuorum@localhost:5432/kuorum
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@kuorum/infrastructure^..." build
      - run: pnpm --filter @kuorum/infrastructure generate
      - run: pnpm --filter @kuorum/infrastructure db:deploy
      - run: pnpm test:int

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kuorum
          POSTGRES_PASSWORD: kuorum
          POSTGRES_DB: kuorum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuorum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kuorum:kuorum@localhost:5432/kuorum
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kuorum/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-e2e
          path: apps/web/playwright-report
          retention-days: 7
